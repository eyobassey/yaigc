# /etc/nginx/sites-available/yaigc-http-test
#
# TEMPORARY HTTP-ONLY config for pre-SSL visual testing.
#
# Replaced by yaigc.conf (full HTTPS) once the Cloudflare Origin Certificate
# is generated and installed. Do not run this in production for any length
# of time; Cloudflare → origin traffic is plaintext under this config.
#
# Topology while this is active:
#
#   Browser
#     │  HTTPS (Cloudflare edge cert, if SSL mode is "Flexible" or "Full")
#     ▼
#   Cloudflare proxy
#     │  HTTP  (only works when SSL mode is "Flexible" or "Off")
#     ▼
#   nginx :80 on the IONOS box (this file)
#     │  HTTP loopback
#     ▼
#   Next.js production server on 127.0.0.1:3002

# Cloudflare IP ranges for real-IP recovery
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/yaigc-http-access.log;
    error_log  /var/log/nginx/yaigc-http-error.log;

    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
