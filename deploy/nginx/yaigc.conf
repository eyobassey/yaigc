# /etc/nginx/sites-available/yaigc
#
# YAIGC web platform — TLS termination + reverse proxy to Next.js.
#
# Topology:
#
#   Browser
#     │  HTTPS (Cloudflare edge cert)
#     ▼
#   Cloudflare (SSL/TLS mode: Full Strict)
#     │  HTTPS (Cloudflare Origin Cert, valid only for CF → origin)
#     ▼
#   nginx :443 on the IONOS box (this file)
#     │  HTTP loopback
#     ▼
#   Next.js production server on 127.0.0.1:3002 (managed by PM2)
#
# Cloudflare proxies traffic to this origin, so set_real_ip_from / real_ip_header
# below recover the original client IP from the CF-Connecting-IP header.

# ---------------------------------------------------------------------------
# Cloudflare IP ranges. Source: https://www.cloudflare.com/ips/
# Update when Cloudflare adds new ranges. A cron job that pulls this list
# and reloads nginx is on the Sprint 1 backlog.
# ---------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name
        youareingoodcompany.co.uk
        www.youareingoodcompany.co.uk
        app.youareingoodcompany.co.uk
        api.youareingoodcompany.co.uk;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name
        youareingoodcompany.co.uk
        www.youareingoodcompany.co.uk
        app.youareingoodcompany.co.uk
        api.youareingoodcompany.co.uk;

    # ---------- Cloudflare Origin Certificate ----------
    # 15-year self-signed-by-Cloudflare cert, valid only for Cloudflare → origin.
    # See docs/runbooks/cloudflare-origin-cert.md for renewal procedure.
    ssl_certificate     /etc/nginx/ssl/youareingoodcompany.co.uk.crt;
    ssl_certificate_key /etc/nginx/ssl/youareingoodcompany.co.uk.key;

    # ---------- TLS hardening ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- Security headers ----------
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- Body size and timeouts ----------
    client_max_body_size 10M;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ---------- Logging ----------
    access_log /var/log/nginx/yaigc-access.log;
    error_log  /var/log/nginx/yaigc-error.log;

    # ---------- Health check (no upstream call, no log) ----------
    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- Reverse proxy to Next.js ----------
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade for Next.js HMR (dev only) and Server-Sent Events
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Cache static Next.js assets at the nginx layer
        # (Cloudflare also caches; this is a belt-and-braces for /_next/static)
        proxy_cache_bypass $http_upgrade;
    }
}
