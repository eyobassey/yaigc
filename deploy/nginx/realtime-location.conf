# /etc/nginx/sites-available/yaigc — paste this BEFORE the catch-all
# `location /` in the main HTTPS server block (so it matches first).
#
# Proxies wss://*.youareingoodcompany.co.uk/realtime/* to the WebSocket
# server on 127.0.0.1:3004. The long proxy_read_timeout keeps idle
# connections alive between server pings (the WS server pings every
# 25 s); the WebSocket headers handle the HTTP/1.1 upgrade.

location /realtime/ {
    proxy_pass http://127.0.0.1:3004/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie            $http_cookie;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # WebSockets keep the connection open. Default 60s would kill it.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # Don't buffer the upgrade response - send straight through.
    proxy_buffering     off;
}
